<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Timezone Digital Clock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            width: 100%;
        }

        .clock-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .clock-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .timezone-name {
            font-size: 18px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .offset {
            font-size: 12px;
            color: #999;
            margin-bottom: 15px;
        }

        .digital-clock {
            font-size: 48px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            color: #333;
            line-height: 1.2;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .time-unit {
            display: inline-block;
        }

        .separator {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 49% {
                opacity: 1;
            }
            50%, 100% {
                opacity: 0.3;
            }
        }

        .date-display {
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }

        .date-display strong {
            color: #764ba2;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }

            .digital-clock {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="clocksContainer"></div>

    <script>
        // Define timezones to display
        const timezones = [
            { name: 'New York', zone: 'America/New_York' },
            { name: 'London', zone: 'Europe/London' },
            { name: 'Tokyo', zone: 'Asia/Tokyo' },
            { name: 'Sydney', zone: 'Australia/Sydney' },
            { name: 'Dubai', zone: 'Asia/Dubai' },
            { name: 'Singapore', zone: 'Asia/Singapore' },
            { name: 'Los Angeles', zone: 'America/Los_Angeles' },
            { name: 'Hong Kong', zone: 'Asia/Hong_Kong' }
        ];

        function createClockCard(timezone) {
            const card = document.createElement('div');
            card.className = 'clock-card';
            card.innerHTML = `
                <div class="timezone-name">${timezone.name}</div>
                <div class="offset" id="offset-${timezone.zone}"></div>
                <div class="digital-clock" id="clock-${timezone.zone}">--:--:--</div>
                <div class="date-display" id="date-${timezone.zone}"></div>
            `;
            return card;
        }

        function formatTime(date) {
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${hours}<span class="separator">:</span>${minutes}<span class="separator">:</span>${seconds}`;
        }

        function formatDate(date) {
            const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
            return date.toLocaleDateString('en-US', options);
        }

        function getUTCOffset(timezone) {
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: timezone,
                hour12: false,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });

            const parts = formatter.formatToParts(new Date());
            const tzDate = new Date(
                parseInt(parts.find(p => p.type === 'year').value),
                parseInt(parts.find(p => p.type === 'month').value) - 1,
                parseInt(parts.find(p => p.type === 'day').value),
                parseInt(parts.find(p => p.type === 'hour').value),
                parseInt(parts.find(p => p.type === 'minute').value),
                parseInt(parts.find(p => p.type === 'second').value)
            );

            const utcDate = new Date();
            const diff = (tzDate - utcDate) / (1000 * 60 * 60);
            const sign = diff >= 0 ? '+' : '';
            const offset = Math.round(diff * 2) / 2;
            return `UTC ${sign}${offset}`;
        }

        function updateClocks() {
            timezones.forEach(timezone => {
                const clockId = `clock-${timezone.zone}`;
                const dateId = `date-${timezone.zone}`;
                const offsetId = `offset-${timezone.zone}`;

                // Get current time in the specific timezone
                const now = new Date();
                const formatter = new Intl.DateTimeFormat('en-US', {
                    timeZone: timezone.zone,
                    hour12: false,
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });

                const parts = formatter.formatToParts(now);
                const tzDate = new Date(
                    parseInt(parts.find(p => p.type === 'year').value),
                    parseInt(parts.find(p => p.type === 'month').value) - 1,
                    parseInt(parts.find(p => p.type === 'day').value),
                    parseInt(parts.find(p => p.type === 'hour').value),
                    parseInt(parts.find(p => p.type === 'minute').value),
                    parseInt(parts.find(p => p.type === 'second').value)
                );

                // Update clock display
                const clockElement = document.getElementById(clockId);
                if (clockElement) {
                    clockElement.innerHTML = formatTime(tzDate);
                }

                // Update date display
                const dateElement = document.getElementById(dateId);
                if (dateElement) {
                    dateElement.innerHTML = `<strong>${formatDate(tzDate)}</strong>`;
                }

                // Update offset display
                const offsetElement = document.getElementById(offsetId);
                if (offsetElement) {
                    offsetElement.textContent = getUTCOffset(timezone.zone);
                }
            });
        }

        // Initialize clocks
        function initClocks() {
            const container = document.getElementById('clocksContainer');
            timezones.forEach(timezone => {
                container.appendChild(createClockCard(timezone));
            });
            updateClocks();
            setInterval(updateClocks, 1000);
        }

        // Start when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initClocks);
        } else {
            initClocks();
        }
    </script>
</body>
</html>
